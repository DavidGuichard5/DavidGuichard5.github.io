<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2022 cosas para el 2022… y para toda la vida</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<!-- Biblioteca oficial de Supabase -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0C0C0E; --bg-2:#151519; --bg-3:#1F1F25; --bg-4:#292933;
  --ink:#F5F4F1; --ink-dim:#A6A3AE; --ink-faint:#6C6975; --line:#2C2C34;
  --magenta:#FF2E7E; --primary:#FF5A1F; --cyan:#00E5D8; --yellow:#F5FF3B; --lime:#A6FF3D;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; overflow-x:hidden; }
#auth-container{ display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: var(--bg); }
.auth-card{ background: var(--bg-2); border: 1px solid var(--line); padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
.auth-card h2{ margin-bottom: 24px; color: var(--primary); font-size: 1.8rem; text-transform: uppercase; }
.auth-input{ width: 100%; padding: 12px; margin-bottom: 16px; background: var(--bg-3); border: 1px solid var(--line); color: var(--ink); border-radius: 4px; font-size: 1rem; }
.auth-btn{ width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 1rem; text-transform: uppercase; cursor: pointer; }
#app-container{ display: none; }
#topbar{ position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:14px 28px; background:rgba(12,12,14,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.brand{ font-family:'Bricolage Grotesque',sans-serif; font-size:1.1rem; font-weight: bold; }
.logout-btn{ background: none; border: 1px solid var(--line); color: var(--ink-dim); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
#hero{ padding: 80px 24px; text-align: center; background: radial-gradient(circle, rgba(255,90,31,0.1) 0%, transparent 70%); }
.hero-title{ font-family:'Bricolage Grotesque',sans-serif; font-size: 3rem; text-shadow:2px 2px 0 var(--primary); text-transform: uppercase; margin: 0 0 10px 0; }
.progress-chip{ background: var(--lime); color: var(--bg); padding: 6px 16px; border-radius: 20px; font-weight: bold; }
.list-section{ max-width: 800px; margin: 40px auto; padding: 0 20px; }
.item-card{ background: var(--bg-2); border: 1px solid var(--line); padding: 20px; border-radius: 6px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
.item-header{ display: flex; align-items: center; justify-content: space-between; }
.item-title{ font-weight: 600; font-size: 1.1rem; }
.checkbox-custom{ width: 24px; height: 24px; cursor: pointer; accent-color: var(--lime); }
.item-textarea{ width: 100%; background: var(--bg-3); border: 1px solid var(--line); color: var(--ink); padding: 10px; border-radius: 4px; resize: vertical; font-family: inherit; }
.rating-container{ display: flex; gap: 6px; }
.star{ cursor: pointer; color: var(--ink-faint); font-size: 1.3rem; }
.star.active{ color: var(--yellow); }
.save-status{ font-size: 0.8rem; color: var(--ink-faint); text-align: right; }
</style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-card">
      <h2>ACCESO AL SET</h2>
      <input type="email" id="auth-email" class="auth-input" placeholder="Correo electrónico">
      <input type="password" id="auth-password" class="auth-input" placeholder="Contraseña">
      <button id="btn-login" class="auth-btn">Iniciar Sesión</button>
    </div>
  </div>

  <div id="app-container">
    <div id="topbar">
      <div class="brand">🎬 CORTOMETRAJE PERSONAL</div>
      <button id="btn-logout" class="logout-btn">Cerrar Corte</button>
    </div>
    <div id="hero">
      <h1 class="hero-title">2022 Cosas para la vida</h1>
      <span id="global-progress" class="progress-chip">Progresando: 0%</span>
    </div>
    <div class="list-section">
      <h2 style="margin-bottom:20px; font-size:1.2rem; color:var(--cyan);">🎬 EL GUION ACTUAL</h2>
      
      <div class="item-card" data-id="1">
        <div class="item-header">
          <div class="item-title">#1 Correr un maratón completo</div>
          <input type="checkbox" class="checkbox-custom" onchange="actualizarItem(1)">
        </div>
        <textarea class="item-textarea" placeholder="Notas de producción..." onchange="actualizarItem(1)"></textarea>
        <div class="rating-container">
          <span class="star" onclick="cambiarEstrellas(1, 1)">★</span>
          <span class="star" onclick="cambiarEstrellas(1, 2)">★</span>
          <span class="star" onclick="cambiarEstrellas(1, 3)">★</span>
          <span class="star" onclick="cambiarEstrellas(1, 4)">★</span>
          <span class="star" onclick="cambiarEstrellas(1, 5)">★</span>
        </div>
        <div class="save-status">Sincronizado</div>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = "https://vqxajkvkdmvelwotmuas.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGFqa3ZrZG12ZWx3b3RtdWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MjEzODEsImV4cCI6MjEwMjI5NzM4MX0.BWUjYPgO4tU6gXNeVGSYFelvfqoPFiqS5VOLGrsZFmg";

// CORRECCIÓN: Inicialización con 'Supabase' en mayúscula para navegadores planos
const supabaseClient = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let usuarioActivo = null;

document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn = document.getElementById('btn-login');
  
  if(!email || !password) return alert("Por favor, completa todos los campos.");
  btn.innerText = "Verificando...";
  
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      alert("Error al ingresar: " + error.message);
      btn.innerText = "Iniciar Sesión";
    } else {
      usuarioActivo = data.user;
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      cargarProgresoNube();
    }
  } catch(e) {
    alert("Error crítico en la conexión: " + e.message);
    btn.innerText = "Iniciar Sesión";
  }
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  location.reload();
});

function cambiarEstrellas(num, rating) {
  const card = document.querySelector(`.item-card[data-id="${num}"]`);
  card.querySelectorAll('.star').forEach((s, i) => i < rating ? s.classList.add('active') : s.classList.remove('active'));
  card.setAttribute('data-rating', rating);
  actualizarItem(num);
}

async function actualizarItem(num) {
  if (!usuarioActivo) return;
  const card = document.querySelector(`.item-card[data-id="${num}"]`);
  const cumplido = card.querySelector('.checkbox-custom').checked;
  const nota = card.querySelector('.item-textarea').value;
  const calificacion = parseInt(card.getAttribute('data-rating')) || null;
  const label = card.querySelector('.save-status');

  label.innerText = "Guardando...";
  const { error } = await supabaseClient.from('progreso_propositos').upsert({
    user_id: usuarioActivo.id, proposito_num: num, cumplido, nota, calificacion, fecha_evidencia: new Date()
  }, { onConflict: 'user_id,proposito_num' });

  label.innerText = error ? "⚠️ Error" : "Sincronizado ✨";
  calcularProgresoGlobal();
}

async function cargarProgresoNube() {
  const { data } = await supabaseClient.from('progreso_propositos').select('*').eq('user_id', usuarioActivo.id);
  if(data) {
    data.forEach(item => {
      const card = document.querySelector(`.item-card[data-id="${item.proposito_num}"]`);
      if (card) {
        card.querySelector('.checkbox-custom').checked = item.cumplido;
        card.querySelector('.item-textarea').value = item.nota || "";
        if (item.calificacion) cambiarEstrellas(item.proposito_num, item.calificacion);
      }
    });
  }
  calcularProgresoGlobal();
}

function calcularProgresoGlobal() {
  const total = document.querySelectorAll('.checkbox-custom').length;
  const done = document.querySelectorAll('.checkbox-custom:checked').length;
  document.getElementById('global-progress').innerText = `Progresando: ${total ? Math.round((done / total) * 100) : 0}%`;
}
</script>
</body>
</html>
